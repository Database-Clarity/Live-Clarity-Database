name: Update contributors

on:
  schedule:
    - cron: '23 4 * * *' # Daily at 04:23 UTC.
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: contributors-readme
  cancel-in-progress: false

jobs:
  contributors:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch every branch (including editor-data permissions)
        run: git fetch --prune origin '+refs/heads/*:refs/remotes/origin/*'
      - name: Test generator
        run: python3 -m unittest discover -s .github/contributors -p 'test_contributors.py'
      - name: Generate contributors block
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/contributors/contributors.py
      - name: Commit only a changed README block
        run: |
          if git diff --quiet -- README.md; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- README.md
          git commit -m 'Update contributors section'
          # A concurrent branch update rejects this push; never force or rebase.
          # GITHUB_TOKEN pushes do not trigger other push workflows.
          git push origin HEAD
