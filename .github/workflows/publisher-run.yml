name: Publish editor data

on:
  workflow_call:
    inputs:
      runner:
        type: string
        required: true

permissions:
  contents: write

jobs:
  pipeline:
    if: github.repository == 'Database-Clarity/Live-Clarity-Database' && github.ref == 'refs/heads/editor-data'
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 30
    outputs:
      production_push: ${{ steps.publish.outputs.production_push }}
      publication: ${{ steps.publish.outputs.publication }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: editor-data
          fetch-depth: 1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      # Publishes for real only when the installed config says publishWritesEnabled: true; the
      # runtime also needs its baked build switch ON (config/publisher.json at the PIN source), so
      # a dry-run install of an enabled build, or an enabled config on a dry-run build, never writes.
      - name: Bundle live data and publish (or simulate)
        id: publish
        env:
          ARTIFACT_DIR: ${{ runner.temp }}/publisher-dry-run
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mode=--pipeline-dry-run
          if node -e 'process.exit(JSON.parse(require("node:fs").readFileSync(".publisher/config.json", "utf8")).publishWritesEnabled === true ? 0 : 1)'; then
            mode=--pipeline-publish
          fi
          echo "Publisher mode: $mode"
          node .publisher/publisher.mjs "$mode" . .publisher/config.json "$ARTIFACT_DIR"
      - name: Upload would-be commits and catch-up status
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: publisher-dry-run-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/publisher-dry-run/
          if-no-files-found: error
          retention-days: 7
      - name: Show catch-up watchdog status
        if: always()
        env:
          ARTIFACT_DIR: ${{ runner.temp }}/publisher-dry-run
        run: |
          if [ -f "$ARTIFACT_DIR/summary.md" ]; then
            cat "$ARTIFACT_DIR/summary.md" >> "$GITHUB_STEP_SUMMARY"
          fi
