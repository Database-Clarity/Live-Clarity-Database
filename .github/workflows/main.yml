name: Validate publisher adoption candidate

on:
  push:
    branches:
      - agents/publisher-adoption
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate_candidate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4

      - name: Use Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x

      - name: Install 🔧
        run: npm ci

      - name: Build 🛠️
        run: npm run build

      - name: Test offline publisher contracts
        run: npm test
