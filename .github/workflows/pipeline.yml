name: Editor data pipeline (publish dry-run)

on:
  push:
    branches: [editor-data]
    # Project configs are built by exports.yml (data site only), never by the publish pipeline.
    paths-ignore: ['exports/**']

permissions:
  contents: write

concurrency:
  group: editor-data-pipeline
  cancel-in-progress: false

jobs:
  pipeline:
    if: github.repository == 'Database-Clarity/Live-Clarity-Database' && github.ref == 'refs/heads/editor-data'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: editor-data
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - name: Bundle live data and simulate publishing
        env:
          ARTIFACT_DIR: ${{ runner.temp }}/publisher-dry-run
          GITHUB_TOKEN: ${{ github.token }}
        run: node .publisher/publisher.mjs --pipeline-dry-run . .publisher/config.json "$ARTIFACT_DIR"
      - name: Upload would-be commits and catch-up status
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: publisher-dry-run-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/publisher-dry-run/
          if-no-files-found: error
          retention-days: 7
      - name: Show catch-up watchdog status
        if: always()
        env:
          ARTIFACT_DIR: ${{ runner.temp }}/publisher-dry-run
        run: |
          if [ -f "$ARTIFACT_DIR/summary.md" ]; then
            cat "$ARTIFACT_DIR/summary.md" >> "$GITHUB_STEP_SUMMARY"
          fi

  # Replaces bundle.yml's report-catalog step with the same inputs (generator v2, editor 0acd005c).
  # It rebuilds report-items.json and report-items.worker.json for the bundle the pipeline job just
  # published (the publisher carries both forward unchanged). Both jobs run in the same workflow
  # run, so the workflow's concurrency group serializes every editor-data-bundle writer. This job
  # runs the pinned editor's npm dependencies, so it holds only a read token; report-items-push
  # validates its output on a separate runner and makes the only write.
  report-items:
    needs: pipeline
    if: ${{ !cancelled() && github.repository == 'Database-Clarity/Live-Clarity-Database' && github.ref == 'refs/heads/editor-data' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      head: ${{ steps.bundle.outputs.head }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: editor-data
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: Database-Clarity/Description-data-generator
          ref: v2
          path: .report-generator
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: Database-Clarity/Description-editor
          ref: 0acd005c0b60e2c9f61b7da6770a9b35c7ec4d8a
          path: .report-source
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - name: Read the published bundle
        id: bundle
        run: |
          set -euo pipefail
          git fetch --depth=1 --no-tags origin refs/heads/editor-data-bundle
          head="$(git rev-parse FETCH_HEAD)"
          mkdir -p "$RUNNER_TEMP/report-items"
          git show "$head:bundle.json" > "$RUNNER_TEMP/bundle.json"
          echo "head=$head" >> "$GITHUB_OUTPUT"
      - name: Build both report catalogs
        run: |
          set -euo pipefail
          REPORTS_GENERATOR_COMMIT="$(git -C .report-generator rev-parse HEAD)"
          export REPORTS_GENERATOR_COMMIT
          npm --prefix .report-source ci --prefer-offline
          .report-source/node_modules/.bin/esbuild scripts/build-report-items.mjs --bundle --platform=node --format=esm --outfile="$RUNNER_TEMP/build-report-items.mjs"
          cp "$RUNNER_TEMP/bundle.json" "$RUNNER_TEMP/report-items/bundle.json"
          node "$RUNNER_TEMP/build-report-items.mjs" "$RUNNER_TEMP/report-items"
          rm "$RUNNER_TEMP/report-items/bundle.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: report-items-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/report-items/
          if-no-files-found: error
          retention-days: 1

  report-items-push:
    needs: report-items
    if: ${{ !cancelled() && needs.report-items.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: editor-data
          sparse-checkout: .publisher
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: report-items-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/report-items
      - name: Validate and push the report catalogs
        env:
          BUNDLE_HEAD: ${{ needs.report-items.outputs.head }}
          CATALOGS: ${{ runner.temp }}/report-items
        run: |
          set -euo pipefail
          [[ "$BUNDLE_HEAD" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::No bundle head from report-items"; exit 1; }
          git fetch --depth=1 --no-tags origin refs/heads/editor-data-bundle
          if [ "$(git rev-parse FETCH_HEAD)" != "$BUNDLE_HEAD" ]; then
            echo "::error::editor-data-bundle moved after the catalogs were built; the next run rebuilds them."
            exit 1
          fi
          git show "$BUNDLE_HEAD:bundle.json" > "$RUNNER_TEMP/bundle.json"
          # Only the two catalogs, each for exactly this bundle; anything else fails closed.
          source="$(node - "$RUNNER_TEMP/bundle.json" "$CATALOGS" <<'JS'
          const { readdirSync, readFileSync } = require('node:fs');
          const [bundlePath, dir] = process.argv.slice(2);
          const { sourceCommit } = JSON.parse(readFileSync(bundlePath, 'utf8'));
          const hex = /^[0-9a-f]{40}$/;
          if (!hex.test(sourceCommit)) throw new Error('Bundle sourceCommit is invalid');
          const names = ['report-items.json', 'report-items.worker.json'];
          if (readdirSync(dir).sort().join() !== names.join()) throw new Error('Unexpected catalog files');
          for (const name of names) {
            const c = JSON.parse(readFileSync(`${dir}/${name}`, 'utf8'));
            if (c.v !== 1 || c.sourceCommit !== sourceCommit || !hex.test(c.generatorCommit) ||
              !c.items || typeof c.items !== 'object' || Array.isArray(c.items))
              throw new Error(`${name} is not a catalog for this bundle`);
          }
          console.log(sourceCommit);
          JS
          )"
          export GIT_INDEX_FILE="$RUNNER_TEMP/report-index"
          git read-tree "$BUNDLE_HEAD"
          for f in report-items.json report-items.worker.json; do
            git update-index --add --cacheinfo "100644,$(git hash-object -w --no-filters "$CATALOGS/$f"),$f"
          done
          tree="$(git write-tree)"
          if [ "$tree" = "$(git rev-parse "$BUNDLE_HEAD^{tree}")" ]; then
            echo "Report catalogs already current for $source."
            exit 0
          fi
          commit="$(git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit-tree "$tree" -p "$BUNDLE_HEAD" -m "Report catalogs for $source")"
          # Fast-forward only, leased on the head read above, never --force: a raced head fails
          # this job and leaves the branch untouched; the next run rebuilds the catalogs.
          git push --force-with-lease="refs/heads/editor-data-bundle:$BUNDLE_HEAD" origin "$commit:refs/heads/editor-data-bundle"
